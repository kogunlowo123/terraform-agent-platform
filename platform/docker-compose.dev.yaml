# TAP local development stack — Postgres, Redis, NATS JetStream, Qdrant,
# Temporal (auto-setup), OPA. Start with:
#   docker compose -f platform/docker-compose.dev.yaml up -d
name: tap-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tap
      POSTGRES_PASSWORD: tap
      POSTGRES_DB: tap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tap -d tap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: tap
      POSTGRES_PWD: tap
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: tap
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

  opa:
    image: openpolicyagent/opa:0.66.0
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      # Dev: mount the repo's Rego policies directly; prod uses bundles.
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ../policies:/policies:ro

volumes:
  pgdata:
  redisdata:
  natsdata:
  qdrantdata:
