name: platform-ci

on:
  pull_request:
    paths:
      - "platform/**"
      - "sdk/**"
      - "agents/**"
      - "tests/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: ruff check
        run: ruff check platform/ sdk/ agents/ tests/ scripts/
      - name: ruff format check
        run: ruff format --check platform/ sdk/ agents/ tests/ scripts/

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install mypy
          [ -d platform ] && pip install -e "./platform[dev]" || true
          [ -d sdk ] && pip install -e ./sdk || true
      - run: mypy platform/ sdk/ --ignore-missing-imports

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          [ -d platform ] && pip install -e "./platform[dev]" || true
          [ -d sdk ] && pip install -e ./sdk || true
      - name: Run unit tests
        run: |
          pytest tests/platform tests/agents -v \
            --cov=platform --cov=agents --cov-report=xml \
            --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  docker-build:
    name: docker build (control plane)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push on PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platform/Dockerfile
          push: false
          tags: tap-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
